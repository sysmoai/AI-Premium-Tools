name: AIPT Commercial Inventory Audit

on:
  pull_request:
    paths:
      - '.github/workflows/aipt-commercial-inventory-audit.yml'
      - 'scripts/aipt-commercial-inventory-audit.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Capture active production SKU commercial states
        run: node scripts/aipt-commercial-inventory-audit.mjs

      - name: Upload catalog-only audit evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aipt-commercial-inventory-${{ github.sha }}
          path: |
            /tmp/aipt-commercial-inventory.json
            /tmp/aipt-commercial-inventory.md
          if-no-files-found: error
          retention-days: 14
