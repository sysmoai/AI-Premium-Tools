name: Apply AIPT D1 Migration 0002 via Preview Binding

on:
  push:
    branches: [ops/apply-d1-migration-0002-via-preview]

jobs:
  migrate:
    runs-on: ubuntu-latest
    concurrency:
      group: aipt-d1-migration
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository before migration
        shell: bash
        run: |
          set -euo pipefail
          pnpm run typecheck
          pnpm --filter @workspace/aipt-store run test
          rm -rf .wrangler/state
          pnpm exec wrangler d1 migrations apply aipt-db --local
          pnpm --filter @workspace/aipt-store run build
        env:
          PORT: '8080'
          BASE_PATH: '/'
          VITE_SITE_URL: 'https://aipremium.tools'

      - name: Apply guarded production D1 migration through preview binding
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_D1_DATABASE_ID: '9c19dfdb-aead-4bed-b6ff-f6bf379bc296'
          PROJECT_NAME: 'ai-premium-tools'
          MIGRATION_BRANCH: 'aipt-db-migration-0002'
        run: |
          set -euo pipefail

          project_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}"
          deployments_url="${project_url}/deployments"
          normalized_token=$(node -e 'const clean=(process.env.CLOUDFLARE_API_TOKEN||"").trim(); if(!clean) process.exit(1); process.stdout.write(clean)')
          migration_nonce=$(node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("hex"))')
          echo "::add-mask::${migration_nonce}"
          migration_deployment_id=""
          migration_deployment_url=""
          clean_deployment_id=""
          preview_modified=0

          cleanup() {
            exit_code=$?
            set +e
            echo "Starting migration cleanup"

            # Remove database capability and ephemeral secret first. Once this
            # succeeds, the migration endpoint cannot touch production D1.
            if [ "$preview_modified" = "1" ]; then
              cleanup_payload='{"deployment_configs":{"preview":{"d1_databases":{"DB":null},"env_vars":{"AIPT_MIGRATION_NONCE":null}}}}'
              cleanup_status=$(curl --silent --show-error --output /tmp/aipt-cleanup-config.json --write-out '%{http_code}' \
                --request PATCH \
                --header "Authorization: Bearer ${normalized_token}" \
                --header "Content-Type: application/json" \
                --data "$cleanup_payload" \
                "$project_url")
              if [ "$cleanup_status" != "200" ]; then
                echo "ERROR: Preview DB/secret cleanup failed with HTTP $cleanup_status"
                exit_code=1
              else
                echo "Preview DB/secret cleanup request succeeded"
              fi
            fi

            # Remove the temporary source from the runner and publish a clean
            # preview so the branch alias no longer exposes the migration route.
            rm -f functions/__aipt_internal_migrate_0002.ts
            if [ -d artifacts/aipt-store/dist/public ]; then
              mv wrangler.toml /tmp/aipt-wrangler.toml 2>/dev/null || true
              clean_output=$(pnpm exec wrangler pages deploy artifacts/aipt-store/dist/public \
                --project-name="$PROJECT_NAME" --branch="$MIGRATION_BRANCH" 2>&1)
              clean_status=$?
              mv /tmp/aipt-wrangler.toml wrangler.toml 2>/dev/null || true
              if [ $clean_status -ne 0 ]; then
                echo "WARNING: Clean preview redeploy failed after migration attempt"
                exit_code=1
              else
                echo "Clean preview redeployed without migration source"
              fi
            fi

            # Verify the project-level preview capability is gone.
            curl --silent --show-error \
              --header "Authorization: Bearer ${normalized_token}" \
              --header "Content-Type: application/json" \
              "$project_url" > /tmp/aipt-project-after-cleanup.json
            EXPECTED_D1_DATABASE_ID="$EXPECTED_D1_DATABASE_ID" node <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('/tmp/aipt-project-after-cleanup.json', 'utf8'));
          const db = x?.result?.deployment_configs?.preview?.d1_databases?.DB?.id ?? null;
          const nonce = x?.result?.deployment_configs?.preview?.env_vars?.AIPT_MIGRATION_NONCE ?? null;
          if (db !== null) throw new Error('Preview DB binding still exists after cleanup');
          if (nonce !== null) throw new Error('Preview migration secret still exists after cleanup');
          console.log('Verified preview DB binding removed');
          console.log('Verified preview migration secret removed');
          NODE
            verify_cleanup=$?
            if [ $verify_cleanup -ne 0 ]; then exit_code=1; fi

            unset migration_nonce normalized_token
            rm -f /tmp/aipt-*.json /tmp/aipt-*.txt /tmp/aipt-before.json /tmp/aipt-after.json
            exit "$exit_code"
          }
          trap cleanup EXIT

          # Identity guard: do not proceed unless the Pages production DB
          # binding is the exact D1 UUID already independently verified.
          if ! [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "Invalid CLOUDFLARE_ACCOUNT_ID format"
            exit 1
          fi
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${normalized_token}" \
            --header "Content-Type: application/json" \
            "$project_url" > /tmp/aipt-project-before.json
          EXPECTED_D1_DATABASE_ID="$EXPECTED_D1_DATABASE_ID" node <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('/tmp/aipt-project-before.json', 'utf8'));
          const production = x?.result?.deployment_configs?.production?.d1_databases?.DB?.id ?? null;
          const previewDb = x?.result?.deployment_configs?.preview?.d1_databases?.DB?.id ?? null;
          const previewNonce = x?.result?.deployment_configs?.preview?.env_vars?.AIPT_MIGRATION_NONCE ?? null;
          if (production !== process.env.EXPECTED_D1_DATABASE_ID) throw new Error('Production Pages DB binding does not match expected AIPT D1 UUID');
          if (previewDb !== null) throw new Error('Refusing migration: preview DB binding was not empty before operation');
          if (previewNonce !== null) throw new Error('Refusing migration: preview migration secret already existed');
          console.log('Verified exact production D1 identity');
          console.log('Verified preview migration capability initially absent');
          NODE

          # Generate an ephemeral migration Function. The nonce is never put in
          # source control; authentication comes from a temporary secret binding.
          cat > functions/__aipt_internal_migrate_0002.ts <<'TS'
          interface Env {
            DB: D1Database;
            AIPT_MIGRATION_NONCE?: string;
          }

          const BASE_TABLES = ["categories", "products", "customers", "orders", "order_items", "reviews"] as const;
          const NEW_TABLES = ["media_assets", "product_families", "product_media"] as const;
          const NEW_PRODUCT_COLUMNS = [
            "slug", "sku", "product_family_id", "short_description", "plan_type", "delivery_type",
            "commercial_state", "sort_order", "seo_title", "seo_description", "seo_index", "updated_at",
          ] as const;
          const NEW_INDEXES = [
            "idx_media_assets_type", "idx_media_assets_status", "idx_media_assets_created_at",
            "idx_product_families_category_id", "idx_product_families_status",
            "idx_products_slug_unique", "idx_products_sku_unique", "idx_products_family_id",
            "idx_products_commercial_state", "idx_products_sort_order",
            "idx_product_media_product_id", "idx_product_media_asset_id", "idx_product_media_sort_order",
          ] as const;
          const KNOWN_MIGRATIONS = ["0001_baseline.sql", "0002_catalog_media_foundation.sql"] as const;

          function json(data: unknown, status = 200): Response {
            return new Response(JSON.stringify(data), {
              status,
              headers: {
                "content-type": "application/json; charset=utf-8",
                "cache-control": "no-store",
                "x-robots-tag": "noindex, nofollow, noarchive",
              },
            });
          }

          function authorized(request: Request, env: Env): boolean {
            const expected = env.AIPT_MIGRATION_NONCE?.trim();
            const header = request.headers.get("authorization")?.trim() ?? "";
            if (!expected || !header.startsWith("Bearer ")) return false;
            return header.slice(7).trim() === expected;
          }

          async function inspect(db: D1Database) {
            const schema = await db.prepare(
              "SELECT name, type FROM sqlite_schema WHERE type IN ('table','index') ORDER BY type, name",
            ).all<{ name: string; type: string }>();
            const tables = new Set((schema.results ?? []).filter(r => r.type === "table").map(r => r.name));
            const indexes = new Set((schema.results ?? []).filter(r => r.type === "index").map(r => r.name));

            const productInfo = await db.prepare("PRAGMA table_info(products)").all<{ name: string }>();
            const productColumns = new Set((productInfo.results ?? []).map(r => r.name));

            const counts: Record<string, number> = {};
            for (const table of BASE_TABLES) {
              if (!tables.has(table)) continue;
              const row = await db.prepare(`SELECT COUNT(*) AS count FROM ${table}`).first<{ count: number }>();
              counts[table] = Number(row?.count ?? 0);
            }

            let ledger: string[] = [];
            if (tables.has("d1_migrations")) {
              const rows = await db.prepare("SELECT name FROM d1_migrations ORDER BY id").all<{ name: string }>();
              ledger = (rows.results ?? []).map(r => r.name);
            }

            const missingBaseTables = BASE_TABLES.filter(name => !tables.has(name));
            const presentNewTables = NEW_TABLES.filter(name => tables.has(name));
            const presentNewColumns = NEW_PRODUCT_COLUMNS.filter(name => productColumns.has(name));
            const presentNewIndexes = NEW_INDEXES.filter(name => indexes.has(name));

            const pre = presentNewTables.length === 0 && presentNewColumns.length === 0 && presentNewIndexes.length === 0;
            const migrated =
              presentNewTables.length === NEW_TABLES.length &&
              presentNewColumns.length === NEW_PRODUCT_COLUMNS.length &&
              presentNewIndexes.length === NEW_INDEXES.length;
            const state = missingBaseTables.length > 0 ? "invalid-base" : pre ? "pre-0002" : migrated ? "migrated-0002" : "partial-0002";

            return {
              state,
              counts,
              missingBaseTables,
              presentNewTables,
              presentNewColumns,
              presentNewIndexes,
              ledger,
            };
          }

          function sameCounts(a: Record<string, number>, b: Record<string, number>): boolean {
            return BASE_TABLES.every(table => a[table] === b[table]);
          }

          function migrationStatements(db: D1Database): D1PreparedStatement[] {
            const sql = [
              `CREATE TABLE IF NOT EXISTS d1_migrations(
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                name TEXT UNIQUE,
                applied_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP NOT NULL
              )`,
              `INSERT OR IGNORE INTO d1_migrations (name) VALUES ('0001_baseline.sql')`,
              `CREATE TABLE IF NOT EXISTS media_assets (
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                r2_key TEXT NOT NULL UNIQUE,
                asset_type TEXT NOT NULL CHECK (asset_type IN ('image','video','document','other')),
                mime_type TEXT NOT NULL,
                original_filename TEXT,
                size_bytes INTEGER NOT NULL,
                width INTEGER,
                height INTEGER,
                duration_ms INTEGER,
                alt_text TEXT,
                caption TEXT,
                poster_asset_id INTEGER REFERENCES media_assets(id),
                status TEXT NOT NULL DEFAULT 'active' CHECK (status IN ('active','archived','deleted')),
                created_by TEXT,
                created_at INTEGER NOT NULL DEFAULT (unixepoch('subsec') * 1000),
                updated_at INTEGER NOT NULL DEFAULT (unixepoch('subsec') * 1000)
              )`,
              `CREATE INDEX IF NOT EXISTS idx_media_assets_type ON media_assets(asset_type)`,
              `CREATE INDEX IF NOT EXISTS idx_media_assets_status ON media_assets(status)`,
              `CREATE INDEX IF NOT EXISTS idx_media_assets_created_at ON media_assets(created_at)`,
              `CREATE TABLE IF NOT EXISTS product_families (
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                slug TEXT NOT NULL UNIQUE,
                name TEXT NOT NULL,
                provider TEXT,
                category_id INTEGER REFERENCES categories(id),
                short_description TEXT,
                description TEXT,
                logo_asset_id INTEGER REFERENCES media_assets(id),
                status TEXT NOT NULL DEFAULT 'active' CHECK (status IN ('active','inactive','hidden')),
                seo_title TEXT,
                seo_description TEXT,
                created_at INTEGER NOT NULL DEFAULT (unixepoch('subsec') * 1000),
                updated_at INTEGER NOT NULL DEFAULT (unixepoch('subsec') * 1000)
              )`,
              `CREATE INDEX IF NOT EXISTS idx_product_families_category_id ON product_families(category_id)`,
              `CREATE INDEX IF NOT EXISTS idx_product_families_status ON product_families(status)`,
              `ALTER TABLE products ADD COLUMN slug TEXT`,
              `ALTER TABLE products ADD COLUMN sku TEXT`,
              `ALTER TABLE products ADD COLUMN product_family_id INTEGER REFERENCES product_families(id)`,
              `ALTER TABLE products ADD COLUMN short_description TEXT`,
              `ALTER TABLE products ADD COLUMN plan_type TEXT`,
              `ALTER TABLE products ADD COLUMN delivery_type TEXT`,
              `ALTER TABLE products ADD COLUMN commercial_state TEXT NOT NULL DEFAULT 'HOLD' CHECK (commercial_state IN ('CUSTOMER_OWNED','AUTHORIZED_SEAT','HOLD','PROHIBITED'))`,
              `ALTER TABLE products ADD COLUMN sort_order INTEGER NOT NULL DEFAULT 0`,
              `ALTER TABLE products ADD COLUMN seo_title TEXT`,
              `ALTER TABLE products ADD COLUMN seo_description TEXT`,
              `ALTER TABLE products ADD COLUMN seo_index INTEGER NOT NULL DEFAULT 1`,
              `ALTER TABLE products ADD COLUMN updated_at INTEGER`,
              `CREATE UNIQUE INDEX IF NOT EXISTS idx_products_slug_unique ON products(slug) WHERE slug IS NOT NULL`,
              `CREATE UNIQUE INDEX IF NOT EXISTS idx_products_sku_unique ON products(sku) WHERE sku IS NOT NULL`,
              `CREATE INDEX IF NOT EXISTS idx_products_family_id ON products(product_family_id)`,
              `CREATE INDEX IF NOT EXISTS idx_products_commercial_state ON products(commercial_state)`,
              `CREATE INDEX IF NOT EXISTS idx_products_sort_order ON products(sort_order)`,
              `CREATE TABLE IF NOT EXISTS product_media (
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                product_id INTEGER NOT NULL REFERENCES products(id) ON DELETE CASCADE,
                media_asset_id INTEGER NOT NULL REFERENCES media_assets(id) ON DELETE CASCADE,
                role TEXT NOT NULL DEFAULT 'gallery' CHECK (role IN ('logo','primary','gallery','thumbnail','hero','video','poster','documentation')),
                sort_order INTEGER NOT NULL DEFAULT 0,
                is_primary INTEGER NOT NULL DEFAULT 0,
                created_at INTEGER NOT NULL DEFAULT (unixepoch('subsec') * 1000),
                UNIQUE(product_id, media_asset_id, role)
              )`,
              `CREATE INDEX IF NOT EXISTS idx_product_media_product_id ON product_media(product_id)`,
              `CREATE INDEX IF NOT EXISTS idx_product_media_asset_id ON product_media(media_asset_id)`,
              `CREATE INDEX IF NOT EXISTS idx_product_media_sort_order ON product_media(product_id, sort_order)`,
              `INSERT OR IGNORE INTO d1_migrations (name) VALUES ('0002_catalog_media_foundation.sql')`,
            ];
            return sql.map(statement => db.prepare(statement));
          }

          export const onRequest: PagesFunction<Env> = async ({ request, env }) => {
            if (request.method !== "POST") return json({ error: "Method not allowed" }, 405);
            if (!authorized(request, env)) return json({ error: "Unauthorized" }, 401);

            let body: { action?: string } = {};
            try { body = await request.json<{ action?: string }>(); } catch {}
            const before = await inspect(env.DB);
            const unknownLedger = before.ledger.filter(name => !KNOWN_MIGRATIONS.includes(name as typeof KNOWN_MIGRATIONS[number]));

            if (body.action === "probe") {
              return json({ ok: true, ...before, unknownLedger });
            }
            if (body.action !== "apply") return json({ error: "Unsupported action" }, 400);
            if (before.state === "invalid-base") return json({ error: "Required base tables are missing", before }, 409);
            if (before.state === "partial-0002") return json({ error: "Refusing to modify a partially migrated database", before }, 409);
            if (unknownLedger.length > 0) return json({ error: "Unknown migration ledger entries present", unknownLedger }, 409);

            if (before.state === "pre-0002") {
              await env.DB.batch(migrationStatements(env.DB));
            } else {
              // Schema is already complete. Adopt the exact Wrangler ledger only
              // if needed; no table/column DDL is repeated in this path.
              const ledgerStatements: D1PreparedStatement[] = [];
              if (!before.ledger.includes("0001_baseline.sql") || !before.ledger.includes("0002_catalog_media_foundation.sql")) {
                ledgerStatements.push(
                  env.DB.prepare(`CREATE TABLE IF NOT EXISTS d1_migrations(
                    id INTEGER PRIMARY KEY AUTOINCREMENT,
                    name TEXT UNIQUE,
                    applied_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP NOT NULL
                  )`),
                  env.DB.prepare("INSERT OR IGNORE INTO d1_migrations (name) VALUES ('0001_baseline.sql')"),
                  env.DB.prepare("INSERT OR IGNORE INTO d1_migrations (name) VALUES ('0002_catalog_media_foundation.sql')"),
                );
              }
              if (ledgerStatements.length > 0) await env.DB.batch(ledgerStatements);
            }

            const after = await inspect(env.DB);
            if (after.state !== "migrated-0002") return json({ error: "Post-migration schema verification failed", before, after }, 500);
            if (!after.ledger.includes("0001_baseline.sql") || !after.ledger.includes("0002_catalog_media_foundation.sql")) {
              return json({ error: "Migration ledger verification failed", before, after }, 500);
            }
            if (!sameCounts(before.counts, after.counts)) {
              return json({ error: "Base table row counts changed unexpectedly", before: before.counts, after: after.counts }, 500);
            }

            return json({
              ok: true,
              applied: before.state === "pre-0002",
              before: { state: before.state, counts: before.counts, ledger: before.ledger },
              after: { state: after.state, counts: after.counts, ledger: after.ledger },
            });
          };
          TS

          # Add the production D1 binding and an ephemeral secret to preview
          # configuration only. This does not affect the canonical domain.
          config_payload=$(EXPECTED_D1_DATABASE_ID="$EXPECTED_D1_DATABASE_ID" MIGRATION_NONCE="$migration_nonce" node -e 'process.stdout.write(JSON.stringify({deployment_configs:{preview:{d1_databases:{DB:{id:process.env.EXPECTED_D1_DATABASE_ID}},env_vars:{AIPT_MIGRATION_NONCE:{type:"secret_text",value:process.env.MIGRATION_NONCE}}}}}))')
          config_status=$(curl --silent --show-error --output /tmp/aipt-preview-config-add.json --write-out '%{http_code}' \
            --request PATCH \
            --header "Authorization: Bearer ${normalized_token}" \
            --header "Content-Type: application/json" \
            --data "$config_payload" \
            "$project_url")
          if [ "$config_status" != "200" ]; then
            echo "Failed to add temporary preview migration capability (HTTP $config_status)"
            exit 1
          fi
          preview_modified=1
          unset config_payload

          # Redeploy is required for new preview bindings. Hide the repository
          # Wrangler file so this ad-hoc preview uses project preview config and
          # does not overwrite it with production binding declarations.
          mv wrangler.toml /tmp/aipt-wrangler.toml
          deploy_started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          set +e
          pnpm exec wrangler pages deploy artifacts/aipt-store/dist/public \
            --project-name="$PROJECT_NAME" --branch="$MIGRATION_BRANCH" > /tmp/aipt-migration-deploy.txt 2>&1
          deploy_status=$?
          set -e
          mv /tmp/aipt-wrangler.toml wrangler.toml
          if [ $deploy_status -ne 0 ]; then
            echo "Preview migration deployment failed"
            sed -n '1,120p' /tmp/aipt-migration-deploy.txt | sed -E 's#https://[^ ]+#<preview-url>#g'
            exit 1
          fi
          echo "Preview migration deployment completed"

          # Locate the exact newest preview deployment for our dedicated branch.
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${normalized_token}" \
            --header "Content-Type: application/json" \
            "${deployments_url}?env=preview&per_page=100" > /tmp/aipt-preview-deployments.json
          MIGRATION_BRANCH="$MIGRATION_BRANCH" DEPLOY_STARTED="$deploy_started" node <<'NODE' > /tmp/aipt-migration-deployment.txt
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('/tmp/aipt-preview-deployments.json', 'utf8'));
          const start = Date.parse(process.env.DEPLOY_STARTED);
          const matches = (x.result || []).filter(d =>
            d?.environment === 'preview' &&
            d?.deployment_trigger?.metadata?.branch === process.env.MIGRATION_BRANCH &&
            Date.parse(d.created_on) >= start - 5000 &&
            d?.latest_stage?.status === 'success'
          ).sort((a,b) => Date.parse(b.created_on) - Date.parse(a.created_on));
          if (!matches.length) throw new Error('Could not identify successful dedicated migration preview deployment');
          const d = matches[0];
          const url = String(d.url || '');
          if (!/^https:\/\/[a-z0-9-]+\.ai-premium-tools\.pages\.dev\/?$/i.test(url)) throw new Error('Unexpected migration deployment URL');
          process.stdout.write(`${d.id}\n${url.replace(/\/$/, '')}\n`);
          NODE
          migration_deployment_id=$(sed -n '1p' /tmp/aipt-migration-deployment.txt)
          migration_deployment_url=$(sed -n '2p' /tmp/aipt-migration-deployment.txt)
          echo "Identified dedicated preview deployment"

          # Probe production D1 through the isolated preview binding. Output is
          # restricted to schema state, migration filenames and aggregate counts.
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${migration_nonce}" \
            --header "Content-Type: application/json" \
            --data '{"action":"probe"}' \
            "${migration_deployment_url}/__aipt_internal_migrate_0002" > /tmp/aipt-before.json
          node <<'NODE'
          const x = require('/tmp/aipt-before.json');
          if (!x.ok) throw new Error('Migration probe was not successful');
          if (!['pre-0002','migrated-0002'].includes(x.state)) throw new Error(`Unsafe database state: ${x.state}`);
          if ((x.unknownLedger || []).length) throw new Error('Unknown migration ledger entries detected');
          console.log(`Production D1 state before operation: ${x.state}`);
          console.log(`Base counts before: ${JSON.stringify(x.counts)}`);
          console.log(`Ledger before: ${JSON.stringify(x.ledger)}`);
          NODE

          # Apply/adopt migration using a D1 batch transaction, then independently
          # verify schema, ledger and unchanged base-table counts in the Function.
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${migration_nonce}" \
            --header "Content-Type: application/json" \
            --data '{"action":"apply"}' \
            "${migration_deployment_url}/__aipt_internal_migrate_0002" > /tmp/aipt-after.json
          node <<'NODE'
          const x = require('/tmp/aipt-after.json');
          if (!x.ok) throw new Error('Migration apply response was not successful');
          if (x.after?.state !== 'migrated-0002') throw new Error('Expected migrated-0002 state after apply');
          const ledger = x.after?.ledger || [];
          if (!ledger.includes('0001_baseline.sql') || !ledger.includes('0002_catalog_media_foundation.sql')) throw new Error('Wrangler migration ledger is incomplete');
          const before = x.before?.counts || {};
          const after = x.after?.counts || {};
          if (JSON.stringify(before) !== JSON.stringify(after)) throw new Error('Base counts changed during migration');
          console.log(`Migration applied in this run: ${Boolean(x.applied)}`);
          console.log(`Production D1 state after operation: ${x.after.state}`);
          console.log(`Base counts after: ${JSON.stringify(after)}`);
          console.log(`Ledger after: ${JSON.stringify(ledger)}`);
          NODE

          # Remove the capability immediately, before normal EXIT cleanup. The
          # trap will verify this again and redeploy the branch without endpoint.
          cleanup_payload='{"deployment_configs":{"preview":{"d1_databases":{"DB":null},"env_vars":{"AIPT_MIGRATION_NONCE":null}}}}'
          cleanup_status=$(curl --silent --show-error --output /tmp/aipt-cleanup-config-early.json --write-out '%{http_code}' \
            --request PATCH \
            --header "Authorization: Bearer ${normalized_token}" \
            --header "Content-Type: application/json" \
            --data "$cleanup_payload" \
            "$project_url")
          if [ "$cleanup_status" != "200" ]; then
            echo "Failed to remove preview migration capability immediately"
            exit 1
          fi
          preview_modified=0
          echo "Removed preview D1 binding and migration secret immediately after verification"

          # Final independent API verification that preview no longer has DB/secret.
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${normalized_token}" \
            --header "Content-Type: application/json" \
            "$project_url" > /tmp/aipt-project-final.json
          node <<'NODE'
          const x = require('/tmp/aipt-project-final.json');
          const db = x?.result?.deployment_configs?.preview?.d1_databases?.DB?.id ?? null;
          const nonce = x?.result?.deployment_configs?.preview?.env_vars?.AIPT_MIGRATION_NONCE ?? null;
