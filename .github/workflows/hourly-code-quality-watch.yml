name: AIPT Hourly Code and Security Quality Watch

on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/hourly-code-quality-watch.yml'
      - '.gitignore'

permissions:
  contents: read
  issues: write

concurrency:
  group: aipt-hourly-code-quality-watch
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        id: typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm run typecheck

      - name: Test storefront
        id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm --filter @workspace/aipt-store run test

      - name: Validate D1 migrations locally
        id: migrations
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm exec wrangler d1 migrations apply aipt-db --local

      - name: Build storefront
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm --filter @workspace/aipt-store run build
        env:
          PORT: '8080'
          BASE_PATH: '/'
          VITE_SITE_URL: 'https://aipremium.tools'

      - name: Production dependency audit
        id: audit
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          pnpm audit --prod --audit-level high > /tmp/aipt-audit.txt 2>&1
          rc=$?
          cat /tmp/aipt-audit.txt
          exit "$rc"

      - name: Repository secret-hygiene guard
        id: hygiene
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          # Secret-bearing local configuration must never be tracked. Keep the
          # documented .env.example template allowed.
          bad_files=$(git ls-files | grep -E '(^|/)(\.env($|\.)|\.dev\.vars($|\.)|wrangler\.toml\.secret$)' | grep -v -E '(^|/)\.env\.example$' || true)
          if [ -n "$bad_files" ]; then
            printf 'Tracked sensitive environment/config file(s):\n%s\n' "$bad_files"
            exit 1
          fi

          # Fail on unmistakable private-key blocks or common live-token
          # prefixes in the current tracked tree. This supplements GitHub's
          # platform scanning; it does not claim to prove historical rotation.
          if git grep -I -n -E -- '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----|github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|sk_live_[A-Za-z0-9]{16,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{30,}' -- .; then
            echo 'Potential live secret/private key detected in tracked content.'
            exit 1
          fi

          echo 'No forbidden secret files or high-confidence credential patterns are tracked.'

      - name: Report, reconcile incident and enforce quality gates
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INSTALL_RESULT: ${{ steps.install.outcome }}
          TYPECHECK_RESULT: ${{ steps.typecheck.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          MIGRATION_RESULT: ${{ steps.migrations.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          AUDIT_RESULT: ${{ steps.audit.outcome }}
          HYGIENE_RESULT: ${{ steps.hygiene.outcome }}
        run: |
          set -euo pipefail
          REPORT=/tmp/aipt-hourly-quality.md
          failed=0

          for value in \
            "$INSTALL_RESULT" \
            "$TYPECHECK_RESULT" \
            "$TEST_RESULT" \
            "$MIGRATION_RESULT" \
            "$BUILD_RESULT" \
            "$AUDIT_RESULT" \
            "$HYGIENE_RESULT"; do
            if [ "$value" != 'success' ]; then failed=1; fi
          done

          {
            echo '# AIPT hourly code/security quality watch'
            echo
            echo "Checked: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo '| Gate | Result |'
            echo '|---|---|'
            echo "| Install | ${INSTALL_RESULT} |"
            echo "| Typecheck | ${TYPECHECK_RESULT} |"
            echo "| Tests | ${TEST_RESULT} |"
            echo "| Local D1 migrations | ${MIGRATION_RESULT} |"
            echo "| Production build | ${BUILD_RESULT} |"
            echo "| High/critical dependency audit | ${AUDIT_RESULT} |"
            echo "| Secret-hygiene guard | ${HYGIENE_RESULT} |"
            echo
            if [ "$failed" -eq 0 ]; then
              echo '**HEALTHY — every hourly code/security quality gate passed.**'
            else
              echo '**UNHEALTHY — one or more hourly code/security quality gates failed.**'
            fi
            echo
            echo 'This watchdog never deploys. It detects regressions on main between feature deployments.'
          } | tee "$REPORT" >> "$GITHUB_STEP_SUMMARY"

          if [ "$EVENT_NAME" != 'pull_request' ]; then
            TITLE='[watch] AIPT code/security quality incident'
            NUMBER=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -n 1)
            if [ "$failed" -ne 0 ]; then
              if [ -n "$NUMBER" ]; then
                gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$REPORT"
              else
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$REPORT"
              fi
            elif [ -n "$NUMBER" ]; then
              gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --comment 'Automatically closed after all hourly code/security quality gates returned green.'
            fi
          fi

          exit "$failed"
