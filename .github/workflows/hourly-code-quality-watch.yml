name: AIPT Hourly Code and Security Quality Watch

on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/hourly-code-quality-watch.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: aipt-hourly-code-quality-watch
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        id: typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm run typecheck

      - name: Test storefront
        id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm --filter @workspace/aipt-store run test

      - name: Validate D1 migrations locally
        id: migrations
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm exec wrangler d1 migrations apply aipt-db --local

      - name: Build storefront
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm --filter @workspace/aipt-store run build
        env:
          PORT: '8080'
          BASE_PATH: '/'
          VITE_SITE_URL: 'https://aipremium.tools'

      - name: Production dependency audit
        id: audit
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          pnpm audit --prod --audit-level high > /tmp/aipt-audit.txt 2>&1
          rc=$?
          cat /tmp/aipt-audit.txt
          exit "$rc"

      - name: Repository secret-hygiene guard
        id: hygiene
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E '(^|/)(\.env|\.env\.local|\.env\.production|wrangler\.toml\.secret)$' || true)
          if [ -n "$bad" ]; then
            printf 'Tracked sensitive environment file(s):\n%s\n' "$bad"
            exit 1
          fi
          echo 'No forbidden environment files are tracked.'

      - name: Build quality report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          REPORT=/tmp/aipt-hourly-quality.md
          {
            echo '# AIPT hourly code/security quality watch'
            echo
            echo "Checked: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo '| Gate | Result |'
            echo '|---|---|'
            echo '| Install | ${{ steps.install.outcome }} |'
            echo '| Typecheck | ${{ steps.typecheck.outcome }} |'
            echo '| Tests | ${{ steps.tests.outcome }} |'
            echo '| Local D1 migrations | ${{ steps.migrations.outcome }} |'
            echo '| Production build | ${{ steps.build.outcome }} |'
            echo '| High/critical dependency audit | ${{ steps.audit.outcome }} |'
            echo '| Secret-hygiene guard | ${{ steps.hygiene.outcome }} |'
            echo
            echo 'This watchdog never deploys. It detects regressions on main between feature deployments.'
          } | tee "$REPORT" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or refresh code-quality incident
        if: always() && github.event_name != 'pull_request' && (steps.install.outcome == 'failure' || steps.typecheck.outcome == 'failure' || steps.tests.outcome == 'failure' || steps.migrations.outcome == 'failure' || steps.build.outcome == 'failure' || steps.audit.outcome == 'failure' || steps.hygiene.outcome == 'failure')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE='[watch] AIPT code/security quality incident'
          NUMBER=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -n 1)
          if [ -n "$NUMBER" ]; then
            gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/aipt-hourly-quality.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file /tmp/aipt-hourly-quality.md
          fi

      - name: Close recovered code-quality incident
        if: always() && github.event_name != 'pull_request' && steps.install.outcome == 'success' && steps.typecheck.outcome == 'success' && steps.tests.outcome == 'success' && steps.migrations.outcome == 'success' && steps.build.outcome == 'success' && steps.audit.outcome == 'success' && steps.hygiene.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE='[watch] AIPT code/security quality incident'
          NUMBER=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -n 1)
          if [ -n "$NUMBER" ]; then
            gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --comment 'Automatically closed after all hourly code/security quality gates returned green.'
          fi

      - name: Fail when a quality gate failed
        if: always() && (steps.install.outcome == 'failure' || steps.typecheck.outcome == 'failure' || steps.tests.outcome == 'failure' || steps.migrations.outcome == 'failure' || steps.build.outcome == 'failure' || steps.audit.outcome == 'failure' || steps.hygiene.outcome == 'failure')
        run: exit 1
