name: Validate and Deploy AIPT

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Default the workflow token to read-only. Production deployment authenticates
# to Cloudflare with dedicated repository secrets rather than GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Enforce AIPT repository/business-unit isolation
        run: node scripts/aipt-repository-isolation-guard.mjs

      - name: Self-test AIPT-0010 visual redesign freeze
        run: bash scripts/aipt-design-freeze-guard-selftest.sh

      - name: Enforce AIPT-0010 evidence-gated visual redesign freeze
        env:
          AIPT_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          AIPT_DIFF_HEAD: ${{ github.sha }}
        run: node scripts/aipt-design-freeze-guard.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test storefront
        run: pnpm --filter @workspace/aipt-store run test

      - name: Validate D1 migrations locally
        run: pnpm exec wrangler d1 migrations apply aipt-db --local

      - name: Build storefront
        run: pnpm --filter @workspace/aipt-store run build
        env:
          PORT: '8080'
          BASE_PATH: '/'
          VITE_SITE_URL: 'https://aipremium.tools'

  deploy-production:
    # A manual dispatch from a feature branch must never receive production
    # deploy credentials or deploy unmerged code. Only the main ref can enter
    # this job, whether triggered by push or workflow_dispatch.
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: aipt-production
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build storefront
        run: pnpm --filter @workspace/aipt-store run build
        env:
          PORT: '8080'
          BASE_PATH: '/'
          VITE_SITE_URL: 'https://aipremium.tools'

      - name: Verify repository migration target
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const expected = ['0001_baseline.sql', '0002_catalog_media_foundation.sql'];
          const files = fs.readdirSync('d1/migrations').filter((name) => name.endsWith('.sql')).sort();
          const target = fs.readFileSync('d1/PRODUCTION_MIGRATION_TARGET', 'utf8').trim();
          if (JSON.stringify(files) !== JSON.stringify(expected)) {
            throw new Error(`Repository migrations differ from the verified production set. Expected ${JSON.stringify(expected)}, found ${JSON.stringify(files)}. Apply any new migration through the guarded production migration process before deployment.`);
          }
          if (target !== expected.at(-1)) {
            throw new Error(`Production migration target mismatch: expected ${expected.at(-1)}, got ${target}`);
          }
          console.log(`Verified repository production migration target: ${target}`);
          NODE

      - name: Verify Cloudflare Pages production D1 binding
        shell: bash
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_D1_DATABASE_ID: '9c19dfdb-aead-4bed-b6ff-f6bf379bc296'
        run: |
          set -euo pipefail
          token=$(node -e 'const value=(process.env.RAW_CLOUDFLARE_API_TOKEN||"").trim(); if(!value) process.exit(1); process.stdout.write(value)')
          account_id=$(node -e 'const value=(process.env.RAW_CLOUDFLARE_ACCOUNT_ID||"").trim(); if(!value) process.exit(1); process.stdout.write(value)')
          if ! [[ "$account_id" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "Invalid Cloudflare account ID format"
            exit 1
          fi
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${token}" \
            --header "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${account_id}/pages/projects/ai-premium-tools" \
            > /tmp/aipt-pages-project.json
          EXPECTED_D1_DATABASE_ID="$EXPECTED_D1_DATABASE_ID" node <<'NODE'
          const x = require('/tmp/aipt-pages-project.json');
          const project = x?.result;
          const id = project?.deployment_configs?.production?.d1_databases?.DB?.id ?? null;
          if (!x?.success || project?.name !== 'ai-premium-tools') throw new Error('Cloudflare Pages project identity check failed');
          if (id !== process.env.EXPECTED_D1_DATABASE_ID) throw new Error(`Production Pages DB binding mismatch: ${id}`);
          console.log(`Verified production Pages binding DB -> ${id}`);
          NODE
          unset token account_id
          rm -f /tmp/aipt-pages-project.json

      - name: Deploy to Cloudflare Pages
        id: deploy-pages
        shell: bash
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          token=$(node -e 'const value=(process.env.RAW_CLOUDFLARE_API_TOKEN||"").trim(); if(!value) process.exit(1); process.stdout.write(value)')
          account_id=$(node -e 'const value=(process.env.RAW_CLOUDFLARE_ACCOUNT_ID||"").trim(); if(!value) process.exit(1); process.stdout.write(value)')
          CLOUDFLARE_API_TOKEN="$token" CLOUDFLARE_ACCOUNT_ID="$account_id" \
            pnpm exec wrangler pages deploy artifacts/aipt-store/dist/public --project-name=ai-premium-tools 2>&1 | tee /tmp/aipt-pages-deploy.log
          deployment_url=$(grep -Eo 'https://[a-z0-9-]+\.ai-premium-tools\.pages\.dev' /tmp/aipt-pages-deploy.log | tail -n 1)
          if [ -z "$deployment_url" ]; then
            echo 'Could not determine the immutable Pages deployment URL'
            exit 1
          fi
          echo "DEPLOYMENT_URL=$deployment_url" >> "$GITHUB_ENV"
          echo "Deployment URL: $deployment_url"
          unset token account_id
          rm -f /tmp/aipt-pages-deploy.log

      - name: Verify immutable Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for $DEPLOYMENT_URL to become healthy..."
          healthy=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 15 "$DEPLOYMENT_URL/api/healthz" | grep -q '"status":"ok"'; then
              healthy=1
              echo "Immutable deployment healthy on attempt $attempt"
              break
            fi
            sleep 2
          done
          if [ "$healthy" -ne 1 ]; then
            echo 'Fresh Pages deployment did not become healthy within 60 seconds'
            exit 1
          fi
          curl --fail --silent --show-error "$DEPLOYMENT_URL/" > /dev/null
          curl --fail --silent --show-error "$DEPLOYMENT_URL/api/products" > /tmp/aipt-deployment-products.json
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/aipt-deployment-products.json","utf8")); if(!Array.isArray(x) || x.length===0) process.exit(1); console.log(`Verified ${x.length} products on immutable deployment`);'
          curl --fail --silent --show-error "$DEPLOYMENT_URL/api/db-schema" > /tmp/aipt-deployment-schema.json
          node <<'NODE'
          const x = require('/tmp/aipt-deployment-schema.json');
          if (x?.status !== 'ok' || x?.migration !== '0002_catalog_media_foundation.sql') throw new Error('Immutable deployment D1 schema health check failed');
          if (!x?.checks?.migrations || !x?.checks?.catalog_media_tables || !x?.checks?.product_columns) throw new Error('Immutable deployment D1 schema invariants failed');
          NODE
          rm -f /tmp/aipt-deployment-products.json /tmp/aipt-deployment-schema.json

      - name: Verify canonical production after propagation
        shell: bash
        run: |
          set -euo pipefail
          echo 'Waiting for canonical Cloudflare edge propagation (bounded to 5 minutes)...'
          propagated=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 15 https://aipremium.tools/api/healthz | grep -q '"status":"ok"'; then
              propagated=1
              echo "Canonical health reached the new healthy runtime on attempt $attempt"
              break
            fi
            sleep 5
          done
          if [ "$propagated" -ne 1 ]; then
            echo 'Canonical domain did not become healthy within the 5-minute propagation window'
            exit 1
          fi

          curl --fail --silent --show-error https://aipremium.tools/ > /dev/null
          curl --fail --silent --show-error https://aipremium.tools/checkout > /dev/null
          curl --fail --silent --show-error https://aipremium.tools/api/products > /tmp/aipt-products.json
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/aipt-products.json","utf8")); if(!Array.isArray(x) || x.length===0) process.exit(1); console.log(`Verified ${x.length} products from canonical production API`);'
          curl --fail --silent --show-error https://aipremium.tools/api/db-schema > /tmp/aipt-db-schema.json
          node <<'NODE'
          const x = require('/tmp/aipt-db-schema.json');
          if (x?.status !== 'ok') throw new Error(`Production D1 schema health is ${String(x?.status)}`);
          if (x?.migration !== '0002_catalog_media_foundation.sql') throw new Error(`Unexpected production migration: ${String(x?.migration)}`);
          if (!x?.checks?.migrations || !x?.checks?.catalog_media_tables || !x?.checks?.product_columns) {
            throw new Error('One or more production D1 schema checks failed');
          }
          console.log(`Verified canonical production D1 schema at ${x.migration}`);
          NODE
          rm -f /tmp/aipt-products.json /tmp/aipt-db-schema.json
