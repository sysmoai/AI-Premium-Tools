name: Validate and Deploy AIPT

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test storefront
        run: pnpm --filter @workspace/aipt-store run test

      - name: Validate D1 migrations locally
        run: pnpm exec wrangler d1 migrations apply aipt-db --local

      - name: Build storefront
        run: pnpm --filter @workspace/aipt-store run build
        env:
          PORT: '8080'
          BASE_PATH: '/'
          VITE_SITE_URL: 'https://aipremium.tools'

  deploy-production:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: aipt-production
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build storefront
        run: pnpm --filter @workspace/aipt-store run build
        env:
          PORT: '8080'
          BASE_PATH: '/'
          VITE_SITE_URL: 'https://aipremium.tools'

      - name: Verify Cloudflare Pages production D1 binding
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_D1_DATABASE_ID: '9c19dfdb-aead-4bed-b6ff-f6bf379bc296'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/ai-premium-tools" \
            > /tmp/aipt-pages-project.json
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/aipt-pages-project.json","utf8")); if(!x.success) throw new Error("Cloudflare Pages project lookup was not successful"); const p=x.result; if(p?.name!=="ai-premium-tools") throw new Error("Unexpected Cloudflare Pages project"); const id=p?.deployment_configs?.production?.d1_databases?.DB?.id; if(!id) throw new Error("Production Pages DB binding is missing"); if(id!==process.env.EXPECTED_D1_DATABASE_ID) throw new Error(`Production Pages DB binding mismatch: expected ${process.env.EXPECTED_D1_DATABASE_ID}, got ${id}`); console.log(`Verified production Pages binding DB -> ${id}`);'

      - name: Verify D1 control-plane access
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 info aipt-db --json

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply aipt-db --remote

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy artifacts/aipt-store/dist/public --project-name=ai-premium-tools

      - name: Verify canonical production
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 3 https://aipremium.tools/ > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 3 https://aipremium.tools/api/healthz | grep -q '"status":"ok"'
          curl --fail --silent --show-error --retry 5 --retry-delay 3 https://aipremium.tools/api/products > /tmp/aipt-products.json
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/aipt-products.json","utf8")); if(!Array.isArray(x) || x.length===0) process.exit(1); console.log(`Verified ${x.length} products from production API`);'
