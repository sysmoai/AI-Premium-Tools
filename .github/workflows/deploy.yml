name: Validate and Deploy AIPT

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test storefront
        run: pnpm --filter @workspace/aipt-store run test

      - name: Validate D1 migrations locally
        run: pnpm exec wrangler d1 migrations apply aipt-db --local

      - name: Build storefront
        run: pnpm --filter @workspace/aipt-store run build
        env:
          PORT: '8080'
          BASE_PATH: '/'
          VITE_SITE_URL: 'https://aipremium.tools'

  deploy-production:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: aipt-production
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build storefront
        run: pnpm --filter @workspace/aipt-store run build
        env:
          PORT: '8080'
          BASE_PATH: '/'
          VITE_SITE_URL: 'https://aipremium.tools'

      - name: Verify Cloudflare Pages production D1 binding
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_D1_DATABASE_ID: '9c19dfdb-aead-4bed-b6ff-f6bf379bc296'
        run: |
          set -euo pipefail
          node -e 'const id=process.env.CLOUDFLARE_ACCOUNT_ID||""; if(!/^[0-9a-f]{32}$/i.test(id)){ console.error(`CLOUDFLARE_ACCOUNT_ID format is invalid (length=${id.length}; expected 32 hexadecimal characters)`); process.exit(1); } console.log("CLOUDFLARE_ACCOUNT_ID format is valid (32 hexadecimal characters)");'

          normalized_token=$(node -e 'const raw=process.env.CLOUDFLARE_API_TOKEN||""; const clean=raw.trim(); if(!clean){console.error("CLOUDFLARE_API_TOKEN is empty after normalization");process.exit(1)} if(clean.length!==raw.length) console.error("CLOUDFLARE_API_TOKEN contains surrounding whitespace; using normalized value for this read-only preflight"); process.stdout.write(clean)')

          status=$(curl --silent --show-error \
            --output /tmp/aipt-pages-project.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${normalized_token}" \
            --header "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/ai-premium-tools")
          printf '%s' "$status" > /tmp/aipt-pages-status.txt
          unset normalized_token

          node <<'NODE'
          const fs = require('fs');
          const status = fs.readFileSync('/tmp/aipt-pages-status.txt', 'utf8').trim();
          let x;
          try {
            x = JSON.parse(fs.readFileSync('/tmp/aipt-pages-project.json', 'utf8'));
          } catch {
            console.error(`Cloudflare Pages project lookup returned HTTP ${status} with a non-JSON response`);
            process.exit(1);
          }
          if (status !== '200' || !x.success) {
            console.error(`Cloudflare Pages project lookup failed with HTTP ${status}`);
            const errors = Array.isArray(x.errors) ? x.errors : [];
            if (errors.length === 0) console.error('Cloudflare returned no structured error details');
            for (const error of errors.slice(0, 5)) {
              console.error(`Cloudflare error ${String(error.code ?? 'unknown')}: ${String(error.message ?? 'Unknown error')}`);
            }
            process.exit(1);
          }
          const project = x.result;
          if (project?.name !== 'ai-premium-tools') throw new Error('Unexpected Cloudflare Pages project');
          const id = project?.deployment_configs?.production?.d1_databases?.DB?.id;
          if (!id) throw new Error('Production Pages DB binding is missing');
          if (id !== process.env.EXPECTED_D1_DATABASE_ID) {
            throw new Error(`Production Pages DB binding mismatch: expected ${process.env.EXPECTED_D1_DATABASE_ID}, got ${id}`);
          }
          console.log(`Verified production Pages binding DB -> ${id}`);
          NODE

      - name: Verify D1 control-plane access
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: 'true'
        run: |
          set -euo pipefail
          normalized_token=$(node -e 'const clean=(process.env.CLOUDFLARE_API_TOKEN||"").trim(); if(!clean) process.exit(1); process.stdout.write(clean)')
          CLOUDFLARE_API_TOKEN="$normalized_token" CLOUDFLARE_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID" pnpm exec wrangler d1 info aipt-db --json
          unset normalized_token

      - name: Apply D1 migrations
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: 'true'
        run: |
          set -euo pipefail
          normalized_token=$(node -e 'const clean=(process.env.CLOUDFLARE_API_TOKEN||"").trim(); if(!clean) process.exit(1); process.stdout.write(clean)')
          CLOUDFLARE_API_TOKEN="$normalized_token" CLOUDFLARE_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID" pnpm exec wrangler d1 migrations apply aipt-db --remote
          unset normalized_token

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy artifacts/aipt-store/dist/public --project-name=ai-premium-tools

      - name: Verify canonical production
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 3 https://aipremium.tools/ > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 3 https://aipremium.tools/api/healthz | grep -q '"status":"ok"'
          curl --fail --silent --show-error --retry 5 --retry-delay 3 https://aipremium.tools/api/products > /tmp/aipt-products.json
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/aipt-products.json","utf8")); if(!Array.isArray(x) || x.length===0) process.exit(1); console.log(`Verified ${x.length} products from production API`);'
