name: SaveOnSub Purge Logo Cache V2

on:
  push:
    branches:
      - ops/saveonsub-cloudflare-diagnose-20260903

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve project-bound zone tag and purge stale apex logo URL
        shell: bash
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: '4ca6269edabb6ad2906d70ec6845de22'
        run: |
          set -euo pipefail
          token=$(node -e 'const v=(process.env.RAW_CLOUDFLARE_API_TOKEN||"").trim(); if(!v) process.exit(1); process.stdout.write(v)')
          domain_code=$(curl --silent --show-error -o /tmp/domain.json -w "%{http_code}" \
            --header "Authorization: Bearer ${token}" \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/pages/projects/saveonsub/domains/saveonsub.com" || true)
          if [ "$domain_code" != "200" ]; then
            echo "Unable to read SaveOnSub Pages custom domain (HTTP ${domain_code})."
            exit 1
          fi
          zone_tag=$(node - <<'NODE'
          const x=require('/tmp/domain.json');
          if(!x?.success || x?.result?.name!=='saveonsub.com' || x?.result?.status!=='active' || !x?.result?.zone_tag) process.exit(2);
          process.stdout.write(x.result.zone_tag);
          NODE
          )
          purge_code=$(curl --silent --show-error -o /tmp/purge.json -w "%{http_code}" \
            --request POST \
            --header "Authorization: Bearer ${token}" \
            --header 'Content-Type: application/json' \
            --data '{"files":["https://saveonsub.com/assets/logo.svg"]}' \
            "https://api.cloudflare.com/client/v4/zones/${zone_tag}/purge_cache" || true)
          if [ "$purge_code" != "200" ]; then
            echo "Cloudflare cache purge failed (HTTP ${purge_code})."
            node -e 'const x=require("/tmp/purge.json"); console.log(JSON.stringify({success:x.success,errors:x.errors}))' || true
            exit 1
          fi
          node -e 'const x=require("/tmp/purge.json"); if(!x.success) process.exit(2); console.log("Purged stale SaveOnSub apex logo cache.")'
          unset token
          rm -f /tmp/domain.json /tmp/purge.json

      - name: Verify approved logo bytes on apex
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --branch=main https://github.com/sysmoai/saveonsub-store.git source >/dev/null 2>&1
          expected=$(sha256sum source/assets/logo.svg | cut -d' ' -f1)
          for attempt in $(seq 1 12); do
            curl -LsS -D /tmp/logo.h -o /tmp/logo.svg https://saveonsub.com/assets/logo.svg
            actual=$(sha256sum /tmp/logo.svg | cut -d' ' -f1)
            if [ "$actual" = "$expected" ]; then
              echo "Approved logo live on apex: ${actual}"
              grep -Ei '^(cache-control|cf-cache-status|age|etag|server|cf-ray):' /tmp/logo.h || true
              exit 0
            fi
            echo "Logo not converged yet (${attempt}/12): ${actual}"
            sleep 5
          done
          echo "Apex logo still differs from approved source."
          exit 1
