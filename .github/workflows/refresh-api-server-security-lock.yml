name: Refresh API Server Security Lock

on:
  push:
    branches: [fix/api-server-security-deps]
    paths:
      - '.github/workflows/refresh-api-server-security-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aipt-api-server-security-lock
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/api-server-security-deps
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Apply narrowly scoped security dependency changes
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const pkgPath = 'artifacts/api-server/package.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          pkg.dependencies['express-rate-limit'] = '^8.6.1';
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');

          const workspacePath = 'pnpm-workspace.yaml';
          let text = fs.readFileSync(workspacePath, 'utf8');
          const marker = '  # drizzle-kit uses esbuild internally on an older version that\'s vulnerable, this overrides it\n';
          if (!text.includes('"router@2.2.0>path-to-regexp"')) {
            if (!text.includes(marker)) throw new Error('Expected overrides insertion marker not found');
            text = text.replace(marker,
              '  # Security: scope patched transitive versions only to their vulnerable parent edges\n' +
              '  "router@2.2.0>path-to-regexp": "8.4.2"\n' +
              '  "express-rate-limit@8.6.1>ip-address": "10.3.1"\n' +
              marker
            );
          }
          fs.writeFileSync(workspacePath, text);
          NODE

      - name: Regenerate lockfile under existing supply-chain policy
        run: pnpm install --lockfile-only

      - name: Verify exact patched graph and audit
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'path-to-regexp@8.4.2' pnpm-lock.yaml
          grep -q 'ip-address@10.3.1' pnpm-lock.yaml
          if grep -q 'path-to-regexp@8.3.0' pnpm-lock.yaml; then
            echo 'Vulnerable path-to-regexp@8.3.0 remains in lockfile'
            exit 1
          fi
          if grep -q 'ip-address@10.1.0' pnpm-lock.yaml; then
            echo 'Vulnerable ip-address@10.1.0 remains in lockfile'
            exit 1
          fi
          pnpm install --frozen-lockfile
          pnpm --filter @workspace/api-server run typecheck
          pnpm --filter @workspace/api-server run build
          pnpm audit --prod --audit-level high

      - name: Commit scoped package and lock changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AIPT Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add artifacts/api-server/package.json pnpm-workspace.yaml pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'No security dependency changes required.'
            exit 0
          fi
          git commit -m 'fix: patch API-server transitive security dependencies'
          git push origin HEAD:fix/api-server-security-deps
