name: SaveOnSub Cloudflare Recovery

on:
  push:
    branches:
      - ops/saveonsub-cloudflare-recovery-20260903

permissions:
  contents: read

concurrency:
  group: saveonsub-cloudflare-recovery
  cancel-in-progress: false

jobs:
  recover-saveonsub:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout recovery control repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Fetch exact current SaveOnSub main
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --branch=main https://github.com/sysmoai/saveonsub-store.git saveonsub
          cd saveonsub
          echo "SOS_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install SaveOnSub build dependencies
        working-directory: saveonsub
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run SaveOnSub truth and price guard
        working-directory: saveonsub
        run: python check_prices.py

      - name: Run full SaveOnSub regression audit
        working-directory: saveonsub
        run: python audit_all.py

      - name: Stage exact public artifact
        working-directory: saveonsub
        run: python stage_deploy.py

      - name: Verify staged public boundary
        working-directory: saveonsub
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'data-brand-lock="2026-08-19-approved"' _site/assets/logo.svg
          grep -q 'data-brand-lock="2026-08-19-approved"' _site/assets/favicon.svg
          test ! -e _site/catalog.json
          test ! -e _site/build_assets.py
          test ! -e _site/.env
          test -f _site/index.html
          test -f _site/sitemap.xml
          test -f _site/robots.txt

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Verify existing Cloudflare credential can access SaveOnSub only
        shell: bash
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SAVEONSUB_ACCOUNT_ID: '4ca6269edabb6ad2906d70ec6845de22'
        run: |
          set -euo pipefail
          token=$(node -e 'const v=(process.env.RAW_CLOUDFLARE_API_TOKEN||"").trim(); if(!v) process.exit(1); process.stdout.write(v)')
          code=$(curl --silent --show-error -o /tmp/saveonsub-project.json -w "%{http_code}" \
            --header "Authorization: Bearer ${token}" \
            "https://api.cloudflare.com/client/v4/accounts/${SAVEONSUB_ACCOUNT_ID}/pages/projects/saveonsub" || true)
          if [ "$code" != "200" ]; then
            echo "Cloudflare credential cannot access SaveOnSub Pages project (HTTP ${code}); recovery stopped without deployment."
            exit 1
          fi
          node <<'NODE'
          const x = require('/tmp/saveonsub-project.json');
          if (!x?.success || x?.result?.name !== 'saveonsub') {
            throw new Error('SaveOnSub Pages project identity verification failed');
          }
          console.log('Verified existing credential access to the SaveOnSub Pages project.');
          NODE
          unset token
          rm -f /tmp/saveonsub-project.json

      - name: Deploy audited SaveOnSub artifact to Cloudflare Pages
        working-directory: saveonsub
        shell: bash
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '4ca6269edabb6ad2906d70ec6845de22'
        run: |
          set -euo pipefail
          token=$(node -e 'const v=(process.env.RAW_CLOUDFLARE_API_TOKEN||"").trim(); if(!v) process.exit(1); process.stdout.write(v)')
          CLOUDFLARE_API_TOKEN="$token" wrangler pages deploy _site \
            --project-name=saveonsub \
            --branch=main \
            --commit-hash="$SOS_SHA"
          unset token

      - name: Verify canonical SaveOnSub production
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 18); do
            home_code=$(curl -LsS -o /tmp/sos-home.html -w "%{http_code}" https://saveonsub.com/ || true)
            logo_code=$(curl -LsS -o /tmp/sos-logo.svg -w "%{http_code}" https://saveonsub.com/assets/logo.svg || true)
            if [ "$home_code" = "200" ] && [ "$logo_code" = "200" ] \
              && grep -q 'data-brand-lock="2026-08-19-approved"' /tmp/sos-home.html \
              && grep -q 'data-brand-lock="2026-08-19-approved"' /tmp/sos-logo.svg; then
              ok=1
              echo "Canonical SaveOnSub now serves the approved release."
              break
            fi
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "Canonical domain did not expose the approved release within the bounded verification window."
            exit 1
          fi
          for path in catalog.json build_assets.py .env; do
            code=$(curl -LsS -o /dev/null -w "%{http_code}" "https://saveonsub.com/${path}" || true)
            if [ "$code" != "404" ]; then
              echo "Internal path /${path} is unexpectedly reachable (HTTP ${code})."
              exit 1
            fi
          done
          echo "SaveOnSub canonical production verification passed."
