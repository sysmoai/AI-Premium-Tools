name: AIPT Production Backup

on:
  workflow_dispatch:
  schedule:
    - cron: '17 21 * * *'
  workflow_run:
    workflows: ['Validate and Deploy AIPT']
    types: [completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: aipt-production-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Request short-lived GitHub OIDC identity
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=aipt-production-backup")
          token=$(printf '%s' "$response" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(!x.value)process.exit(1);process.stdout.write(x.value)})')
          echo "::add-mask::$token"
          printf '%s' "$token" > /tmp/aipt-oidc-token
          unset token response

      - name: Capture encrypted production backup
        shell: bash
        run: |
          set -euo pipefail
          token=$(cat /tmp/aipt-oidc-token)
          code=$(curl --silent --show-error \
            --connect-timeout 10 --max-time 1500 \
            --request POST \
            --header "Authorization: Bearer ${token}" \
            --header 'Accept: application/json' \
            --output /tmp/aipt-backup-summary.json \
            --write-out '%{http_code}' \
            'https://aipremium.tools/internal/aipt-backup')
          if [ "$code" != '200' ]; then
            echo "Backup endpoint returned HTTP ${code}" >&2
            node -e 'const fs=require("fs");try{const x=JSON.parse(fs.readFileSync("/tmp/aipt-backup-summary.json","utf8"));console.error(x?.error||"Backup failed")}catch{}'
            exit 1
          fi
          node <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('/tmp/aipt-backup-summary.json', 'utf8'));
          if (x.status !== 'ok' || x.verified !== true) throw new Error('Backup did not report verified status=ok');
          if (!x.snapshot_id || !x.encryption_key_fingerprint) throw new Error('Backup identity evidence incomplete');
          if (!x.database || x.database.tables < 1 || x.database.rows < 1 || !x.database.plaintext_sha256) throw new Error('Database backup evidence incomplete');
          if (!x.media || x.media.source_objects < 0) throw new Error('Media backup evidence incomplete');
          if (x.media.new_copies + x.media.reused_copies !== x.media.source_objects) throw new Error('Media backup accounting mismatch');
          if (!x.manifest_plaintext_sha256) throw new Error('Manifest verification evidence incomplete');
          const lines = [
            '# AIPT production backup',
            '',
            `- Status: **${x.status.toUpperCase()} / VERIFIED**`,
            `- Captured: ${x.captured_at}`,
            `- Snapshot ID: \`${x.snapshot_id}\``,
            `- Recovery public-key fingerprint: \`${x.encryption_key_fingerprint}\``,
            `- D1 logical snapshot: ${x.database.tables} table(s), ${x.database.rows} row(s)`,
            `- D1 plaintext bytes before encryption: ${x.database.plaintext_bytes}`,
            `- D1 plaintext SHA-256: \`${x.database.plaintext_sha256}\``,
            `- R2 source media: ${x.media.source_objects} object(s) / ${x.media.source_bytes} bytes`,
            `- New encrypted media copies: ${x.media.new_copies}`,
            `- Existing encrypted media reused: ${x.media.reused_copies}`,
            `- Private manifest SHA-256: \`${x.manifest_plaintext_sha256}\``,
            '',
            '> Backup payloads and original object keys are encrypted. No plaintext database rows, customer data, payment data, or media keys are uploaded to GitHub artifacts.',
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          fs.writeFileSync('/tmp/aipt-snapshot-id', x.snapshot_id);
          fs.appendFileSync(process.env.GITHUB_ENV, `AIPT_SNAPSHOT_ID=${x.snapshot_id}\n`);
          NODE

      - name: Verify backup namespace is not publicly downloadable
        shell: bash
        run: |
          set -euo pipefail
          snapshot=$(cat /tmp/aipt-snapshot-id)
          code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            "https://aipremium.tools/media/_aipt-backups/${snapshot}/manifest.json.enc")
          if [ "$code" != '404' ]; then
            echo "Encrypted backup namespace must return 404 publicly; got HTTP ${code}" >&2
            exit 1
          fi
          echo 'Reserved backup media namespace correctly returns 404.' >> "$GITHUB_STEP_SUMMARY"

      - name: Export encrypted backup corpus for off-provider copy
        shell: bash
        run: |
          set -euo pipefail
          token=$(cat /tmp/aipt-oidc-token)
          mkdir -p /tmp/aipt-offsite/objects
          code=$(curl --silent --show-error \
            --connect-timeout 10 --max-time 120 \
            --request POST \
            --header "Authorization: Bearer ${token}" \
            --header 'Accept: application/json' \
            --output /tmp/aipt-offsite/export-index.json \
            --write-out '%{http_code}' \
            'https://aipremium.tools/internal/aipt-backup-export?mode=index')
          test "$code" = '200'

          node <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('/tmp/aipt-offsite/export-index.json', 'utf8'));
          if (x.status !== 'ok' || x.encrypted_only !== true) throw new Error('Encrypted export index invalid');
          if (!Array.isArray(x.objects) || x.objects.length < 2) throw new Error('Encrypted export inventory unexpectedly small');
          const mapping = x.objects.map((o, i) => ({
            local_file: `objects/${String(i + 1).padStart(6, '0')}.enc`,
            backup_key: o.key,
            size: o.size,
            etag: o.etag,
            uploaded: o.uploaded,
          }));
          fs.writeFileSync('/tmp/aipt-offsite/restore-index.json', JSON.stringify({
            format: 'aipt-offsite-encrypted-v1',
            encrypted_only: true,
            generated_at: new Date().toISOString(),
            object_count: mapping.length,
            total_bytes: x.total_bytes,
            objects: mapping,
          }, null, 2));
          fs.writeFileSync('/tmp/aipt-offsite/download.tsv', mapping.map((o) => [
            Buffer.from(o.backup_key).toString('base64'),
            o.local_file,
            o.size,
          ].join('\t')).join('\n') + '\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `- Encrypted offsite inventory: ${mapping.length} object(s) / ${x.total_bytes} bytes\n`);
          NODE

          while IFS=$'\t' read -r key_b64 local_file expected_size; do
            [ -n "$key_b64" ] || continue
            key=$(printf '%s' "$key_b64" | base64 --decode)
            encoded=$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$key")
            dest="/tmp/aipt-offsite/${local_file}"
            code=$(curl --silent --show-error \
              --connect-timeout 10 --max-time 900 \
              --request POST \
              --header "Authorization: Bearer ${token}" \
              --output "$dest" \
              --write-out '%{http_code}' \
              "https://aipremium.tools/internal/aipt-backup-export?mode=download&key=${encoded}")
            test "$code" = '200'
            actual_size=$(stat -c%s "$dest")
            test "$actual_size" = "$expected_size"
            unset key encoded dest actual_size
          done < /tmp/aipt-offsite/download.tsv

          rm -f /tmp/aipt-offsite/download.tsv
          (cd /tmp/aipt-offsite && sha256sum objects/*.enc > SHA256SUMS)
          node <<'NODE'
          const fs = require('fs');
          const index = JSON.parse(fs.readFileSync('/tmp/aipt-offsite/restore-index.json', 'utf8'));
          const checks = fs.readFileSync('/tmp/aipt-offsite/SHA256SUMS', 'utf8').trim().split('\n').filter(Boolean);
          if (checks.length !== index.object_count) throw new Error('Offsite checksum count mismatch');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '- Encrypted offsite object download + SHA-256 verification: PASS\n');
          NODE

      - name: Upload short-retention encrypted offsite artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aipt-offsite-encrypted-${{ env.AIPT_SNAPSHOT_ID }}
          path: /tmp/aipt-offsite
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Remove local authentication and backup traces
        if: always()
        shell: bash
        run: rm -rf /tmp/aipt-oidc-token /tmp/aipt-backup-summary.json /tmp/aipt-snapshot-id /tmp/aipt-offsite
