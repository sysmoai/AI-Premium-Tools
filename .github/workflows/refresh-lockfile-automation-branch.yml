name: Refresh AIPT automation branch lockfile

on:
  push:
    branches: [ops/automation-control-plane-v2]
    paths:
      - 'package.json'
      - '.github/workflows/refresh-lockfile-automation-branch.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aipt-refresh-lockfile-automation-branch
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/automation-control-plane-v2
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Regenerate lockfile only
        run: pnpm install --lockfile-only
      - name: Commit refreshed lockfile when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'pnpm-lock.yaml already matches package metadata.'
            exit 0
          fi
          git config user.name 'AIPT Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'fix: refresh lockfile for patched transitive dependencies'
          git push origin HEAD:ops/automation-control-plane-v2
