name: AIPT Commercial Truth v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aipt-commercial-truth-v2
  cancel-in-progress: false

jobs:
  normalize-production-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact main release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build hardened storefront artifact
        run: pnpm --filter @workspace/aipt-store run build
        env:
          PORT: '8080'
          BASE_PATH: '/'
          VITE_SITE_URL: 'https://aipremium.tools'

      - name: Normalize production catalog through isolated Pages binding
        shell: bash
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_D1_DATABASE_ID: '9c19dfdb-aead-4bed-b6ff-f6bf379bc296'
          PROJECT_NAME: 'ai-premium-tools'
          NORMALIZATION_BRANCH: 'aipt-commercial-v2-20260917'
        run: |
          set -euo pipefail

          token=$(node -e 'const v=(process.env.RAW_CLOUDFLARE_API_TOKEN||"").trim(); if(!v) process.exit(1); process.stdout.write(v)')
          account_id=$(node -e 'const v=(process.env.RAW_CLOUDFLARE_ACCOUNT_ID||"").trim(); if(!v) process.exit(1); process.stdout.write(v)')
          echo "::add-mask::${token}"
          nonce=$(node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("hex"))')
          echo "::add-mask::${nonce}"

          if ! [[ "$account_id" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo 'Invalid Cloudflare account ID format'
            exit 1
          fi

          project_url="https://api.cloudflare.com/client/v4/accounts/${account_id}/pages/projects/${PROJECT_NAME}"
          deployments_url="${project_url}/deployments"
          preview_config_modified=0
          mutation_deployment_seen=0
          mutation_deployment_id=""

          cf_get() {
            curl --fail --silent --show-error \
              --header "Authorization: Bearer ${token}" \
              --header 'Content-Type: application/json' \
              "$1"
          }

          cf_patch() {
            curl --fail --silent --show-error \
              --request PATCH \
              --header "Authorization: Bearer ${token}" \
              --header 'Content-Type: application/json' \
              --data "$2" \
              "$1"
          }

          deploy_preview() {
            CLOUDFLARE_API_TOKEN="$token" CLOUDFLARE_ACCOUNT_ID="$account_id" \
              pnpm exec wrangler pages deploy artifacts/aipt-store/dist/public \
              --project-name="$PROJECT_NAME" --branch="$NORMALIZATION_BRANCH"
          }

          cleanup() {
            original_exit=$?
            set +e
            echo 'Starting guaranteed commercial-normalization cleanup'

            if [ "$preview_config_modified" = "1" ]; then
              cf_patch "$project_url" '{"deployment_configs":{"preview":{"d1_databases":{"DB":null},"env_vars":{"AIPT_COMMERCIAL_V2_NONCE":null}}}}' > /tmp/aipt-commercial-cleanup-config.json
              if [ $? -ne 0 ]; then
                echo 'ERROR: failed to remove temporary preview DB/secret config'
                original_exit=1
              else
                preview_config_modified=0
              fi
            fi

            rm -f functions/__aipt_internal_commercial_v2.ts

            if [ "$mutation_deployment_seen" = "1" ]; then
              mv wrangler.toml /tmp/aipt-commercial-wrangler.toml 2>/dev/null || true
              deploy_preview > /tmp/aipt-commercial-clean-deploy.txt 2>&1
              clean_status=$?
              mv /tmp/aipt-commercial-wrangler.toml wrangler.toml 2>/dev/null || true
              if [ $clean_status -ne 0 ]; then
                echo 'ERROR: clean normalization-branch preview redeploy failed'
                original_exit=1
              else
                cf_get "$deployments_url" > /tmp/aipt-commercial-deployments-clean.json
                NORMALIZATION_BRANCH="$NORMALIZATION_BRANCH" node <<'NODE' > /tmp/aipt-commercial-old-deployment-ids.txt
          const x = require('/tmp/aipt-commercial-deployments-clean.json');
          if (!x?.success || !Array.isArray(x.result)) throw new Error('Deployment listing failed during cleanup');
          const matches = x.result
            .filter(d => d?.environment === 'preview' && d?.deployment_trigger?.metadata?.branch === process.env.NORMALIZATION_BRANCH)
            .sort((a,b) => Date.parse(b.created_on) - Date.parse(a.created_on));
          if (!matches.length) throw new Error('No normalization branch deployment found during cleanup');
          const newest = matches[0];
          const secret = newest?.env_vars?.AIPT_COMMERCIAL_V2_NONCE ?? null;
          const db = newest?.d1_databases?.DB?.id ?? null;
          if (secret !== null) throw new Error('Latest clean deployment still has normalization secret');
          if (db !== null) throw new Error('Latest clean deployment still has preview D1 binding');
          for (const d of matches.slice(1)) console.log(d.id);
          NODE
                if [ $? -ne 0 ]; then
                  original_exit=1
                else
                  while IFS= read -r deployment_id; do
                    [ -z "$deployment_id" ] && continue
                    status=$(curl --silent --show-error --output /tmp/aipt-commercial-delete-response.json --write-out '%{http_code}' \
                      --request DELETE \
                      --header "Authorization: Bearer ${token}" \
                      --header 'Content-Type: application/json' \
                      "${deployments_url}/${deployment_id}?force=true")
                    if [ "$status" != "200" ] && [ "$status" != "204" ]; then
                      echo "ERROR: failed to delete older normalization deployment (HTTP $status)"
                      original_exit=1
                    fi
                  done < /tmp/aipt-commercial-old-deployment-ids.txt
                fi
              fi
            fi

            cf_get "$project_url" > /tmp/aipt-commercial-project-clean.json
            node <<'NODE'
          const x = require('/tmp/aipt-commercial-project-clean.json');
          const db = x?.result?.deployment_configs?.preview?.d1_databases?.DB?.id ?? null;
          const secret = x?.result?.deployment_configs?.preview?.env_vars?.AIPT_COMMERCIAL_V2_NONCE ?? null;
          if (db !== null) throw new Error('Preview DB binding remains after cleanup');
          if (secret !== null) throw new Error('Preview normalization secret remains after cleanup');
          console.log('Verified temporary preview D1 binding and secret are absent');
          NODE
            if [ $? -ne 0 ]; then original_exit=1; fi

            if [ -n "$mutation_deployment_id" ]; then
              status=$(curl --silent --show-error --output /tmp/aipt-commercial-deleted-check.json --write-out '%{http_code}' \
                --header "Authorization: Bearer ${token}" \
                --header 'Content-Type: application/json' \
                "${deployments_url}/${mutation_deployment_id}")
              if [ "$status" = "404" ]; then
                echo 'Verified mutation-capable preview deployment deleted'
              else
                echo "ERROR: mutation-capable preview deployment still resolves in control plane (HTTP $status)"
                original_exit=1
              fi
            fi

            unset token account_id nonce
            rm -f /tmp/aipt-commercial-*.json /tmp/aipt-commercial-*.txt
            exit "$original_exit"
          }
          trap cleanup EXIT

          cf_get "$project_url" > /tmp/aipt-commercial-project-before.json
          EXPECTED_D1_DATABASE_ID="$EXPECTED_D1_DATABASE_ID" node <<'NODE'
          const x = require('/tmp/aipt-commercial-project-before.json');
          const productionDb = x?.result?.deployment_configs?.production?.d1_databases?.DB?.id ?? null;
          const previewDb = x?.result?.deployment_configs?.preview?.d1_databases?.DB?.id ?? null;
          const previewSecret = x?.result?.deployment_configs?.preview?.env_vars?.AIPT_COMMERCIAL_V2_NONCE ?? null;
          if (!x?.success || x?.result?.name !== 'ai-premium-tools') throw new Error('Unexpected Cloudflare Pages project');
          if (productionDb !== process.env.EXPECTED_D1_DATABASE_ID) throw new Error(`Production DB identity mismatch: ${productionDb}`);
          if (previewDb !== null) throw new Error('Preview DB binding must be absent before normalization');
          if (previewSecret !== null) throw new Error('Preview normalization secret must be absent before normalization');
          console.log(`Verified exact production D1 UUID: ${productionDb}`);
          NODE

          cp scripts/ops/aipt-commercial-v2-pages-function.ts functions/__aipt_internal_commercial_v2.ts

          add_payload=$(EXPECTED_D1_DATABASE_ID="$EXPECTED_D1_DATABASE_ID" NORMALIZATION_NONCE="$nonce" node -e 'process.stdout.write(JSON.stringify({deployment_configs:{preview:{d1_databases:{DB:{id:process.env.EXPECTED_D1_DATABASE_ID}},env_vars:{AIPT_COMMERCIAL_V2_NONCE:{type:"secret_text",value:process.env.NORMALIZATION_NONCE}}}}}))')
          cf_patch "$project_url" "$add_payload" > /tmp/aipt-commercial-preview-config-add.json
          preview_config_modified=1
          unset add_payload

          mv wrangler.toml /tmp/aipt-commercial-wrangler.toml
          deploy_started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          set +e
          deploy_preview > /tmp/aipt-commercial-mutation-deploy.txt 2>&1
          deploy_status=$?
          set -e
          mv /tmp/aipt-commercial-wrangler.toml wrangler.toml
          if [ $deploy_status -ne 0 ]; then
            echo 'Isolated normalization preview deployment failed'
            sed -n '1,100p' /tmp/aipt-commercial-mutation-deploy.txt | sed -E 's#https://[^ ]+#<preview-url>#g'
            exit 1
          fi
          mutation_deployment_seen=1

          cf_get "$deployments_url" > /tmp/aipt-commercial-preview-deployments.json
          NORMALIZATION_BRANCH="$NORMALIZATION_BRANCH" DEPLOY_STARTED="$deploy_started" node <<'NODE' > /tmp/aipt-commercial-mutation-deployment.txt
          const x = require('/tmp/aipt-commercial-preview-deployments.json');
          if (!x?.success || !Array.isArray(x.result)) throw new Error('Deployment listing failed');
          const start = Date.parse(process.env.DEPLOY_STARTED);
          const matches = x.result
            .filter(d => d?.environment === 'preview' && d?.deployment_trigger?.metadata?.branch === process.env.NORMALIZATION_BRANCH && Date.parse(d.created_on) >= start - 10000)
            .sort((a,b) => Date.parse(b.created_on) - Date.parse(a.created_on));
          if (!matches.length) throw new Error('Normalization deployment could not be identified');
          const d = matches[0];
          const url = String(d.url || '').replace(/\/$/, '');
          if (!/^https:\/\/[a-z0-9-]+\.ai-premium-tools\.pages\.dev$/i.test(url)) throw new Error('Unexpected preview deployment URL');
          if (d?.d1_databases?.DB?.id !== process.env.EXPECTED_D1_DATABASE_ID) throw new Error('Mutation preview is not bound to the expected D1');
          if (!d?.env_vars?.AIPT_COMMERCIAL_V2_NONCE) throw new Error('Mutation preview is missing its one-time secret');
          process.stdout.write(`${d.id}\n${url}\n`);
          NODE
          mutation_deployment_id=$(sed -n '1p' /tmp/aipt-commercial-mutation-deployment.txt)
          mutation_url=$(sed -n '2p' /tmp/aipt-commercial-mutation-deployment.txt)

          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${nonce}" \
            --header 'Content-Type: application/json' \
            --data '{"action":"probe"}' \
            "${mutation_url}/__aipt_internal_commercial_v2" > /tmp/aipt-commercial-before.json
          node <<'NODE'
          const x = require('/tmp/aipt-commercial-before.json');
          if (!x?.ok || x?.revision !== 'aipt-pricing-v2-2026-09-17') throw new Error('Pre-normalization probe failed');
          console.log(`Production catalog before: total=${x.before.total}, active=${x.before.active}, sharedActive=${x.before.sharedActive}`);
          NODE

          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${nonce}" \
            --header 'Content-Type: application/json' \
            --data '{"action":"apply"}' \
            "${mutation_url}/__aipt_internal_commercial_v2" > /tmp/aipt-commercial-after.json
          node <<'NODE'
          const x = require('/tmp/aipt-commercial-after.json');
          if (!x?.ok || x?.revision !== 'aipt-pricing-v2-2026-09-17') throw new Error(`Commercial normalization failed: ${JSON.stringify(x?.errors || x?.error || 'unknown')}`);
          if (Number(x?.after?.active || 0) < 10) throw new Error('Too few approved active plans after normalization');
          if (Number(x?.after?.sharedActive || 0) !== 0) throw new Error('Shared credential offers remained active');
          console.log(`AIPT Commercial Truth v2 applied: total=${x.after.total}, active=${x.after.active}, sharedActive=${x.after.sharedActive}`);
          NODE
