    <!-- Site-wide Organization JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "AIPT — AI Premium Tools",
      "alternateName": "AIPT",
      "description": "Bangladesh's most affordable store for premium AI subscriptions.",

      "paymentAccepted": "bKash, Nagad, Rocket, Upay, Bank Transfer",
      "currenciesAccepted": "BDT"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        try {
          var p = new URLSearchParams(window.location.search).get("theme");
          if (p === "dark") { document.documentElement.classList.add("dark"); localStorage.setItem("aipt_dark", "true"); }
          else if (p === "light") { document.documentElement.classList.remove("dark"); localStorage.setItem("aipt_dark", "false"); }
          else if (localStorage.getItem("aipt_dark") === "true") { document.documentElement.classList.add("dark"); }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
