kind = "web"
previewPath = "/"
title = "AI Premium Tools Store"
version = "1.0.0"
id = "artifacts/aipt-store"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24965

[services.development]
run = "pnpm --filter @workspace/aipt-store run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aipt-store", "run", "build" ]
publicDir = "artifacts/aipt-store/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24965"
BASE_PATH = "/"
