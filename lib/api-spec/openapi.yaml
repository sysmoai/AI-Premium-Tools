openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AI Premium Tools (AIPT) ecommerce API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Product management
  - name: categories
    description: Category management
  - name: orders
    description: Order management
  - name: customers
    description: Customer management
  - name: stats
    description: Admin statistics
  - name: admin
    description: Admin authentication
  - name: reviews
    description: Product reviews
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Products ──────────────────────────────────────────────────────────────
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List all products
      parameters:
        - name: category_id
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
        - name: featured
          in: query
          schema:
            type: boolean
        - name: is_active
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductBody"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
    put:
      operationId: updateProduct
      tags: [products]
      summary: Update a product (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductBody"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Reviews ───────────────────────────────────────────────────────────────
  /products/{id}/reviews:
    get:
      operationId: listProductReviews
      tags: [reviews]
      summary: List approved reviews for a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of approved reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"

  /reviews:
    post:
      operationId: createReview
      tags: [reviews]
      summary: Submit a customer review (moderated before publishing)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewBody"
      responses:
        "201":
          description: Review submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateReviewResponse"

  # ── Categories ────────────────────────────────────────────────────────────
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a category (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryBody"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /categories/{id}:
    put:
      operationId: updateCategory
      tags: [categories]
      summary: Update a category (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryBody"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
    delete:
      operationId: deleteCategory
      tags: [categories]
      summary: Delete a category (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Orders ────────────────────────────────────────────────────────────────
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List all orders (admin)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, delivered, cancelled]
        - name: customer_id
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Place a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderBody"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order by ID
      description: |
        Public lookup for customers. Without an admin token, the request must
        include the `phone` query parameter matching the order's customer phone
        (digits only). Non-admin responses omit `customer_phone`, `payment_ref`,
        and `notes`. With an admin bearer token, all fields are returned.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: phone
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found or phone does not match

  /orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Update order status (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderStatusBody"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  # ── Customers ─────────────────────────────────────────────────────────────
  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List all customers (admin)
      responses:
        "200":
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create / register a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerBody"
      responses:
        "201":
          description: Created customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  /customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Get customer by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Customer details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  # ── Admin Auth ────────────────────────────────────────────────────────────
  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Exchange admin password for a bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginBody"
      responses:
        "200":
          description: Login OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginResponse"
        "401":
          description: Invalid password

  # ── Admin Stats ───────────────────────────────────────────────────────────
  /stats/dashboard:
    get:
      operationId: getDashboardStats
      tags: [stats]
      summary: Get admin dashboard statistics
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /stats/recent-orders:
    get:
      operationId: getRecentOrders
      tags: [stats]
      summary: Get recent orders feed
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Recent orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

  /stats/top-products:
    get:
      operationId: getTopProducts
      tags: [stats]
      summary: Get top selling products
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 5
      responses:
        "200":
          description: Top products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ── Product ──────────────────────────────────────────────────────────────
    Product:
      type: object
      required: [id, name, price_bdt, category_id, is_active, is_featured, created_at]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        price_bdt:
          type: number
        original_price_bdt:
          type: number
        category_id:
          type: integer
        category_name:
          type: string
        image_url:
          type: string
        features:
          type: array
          items:
            type: string
        duration_days:
          type: integer
        is_active:
          type: boolean
        is_featured:
          type: boolean
        stock_count:
          type: integer
        order_count:
          type: integer
        created_at:
          type: string

    CreateProductBody:
      type: object
      required: [name, price_bdt, category_id]
      properties:
        name:
          type: string
        description:
          type: string
        price_bdt:
          type: number
        original_price_bdt:
          type: number
        category_id:
          type: integer
        image_url:
          type: string
        features:
          type: array
          items:
            type: string
        duration_days:
          type: integer
        is_active:
          type: boolean
        is_featured:
          type: boolean
        stock_count:
          type: integer

    # ── Category ─────────────────────────────────────────────────────────────
    Category:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        icon:
          type: string
        product_count:
          type: integer

    CreateCategoryBody:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        icon:
          type: string

    # ── Order ─────────────────────────────────────────────────────────────────
    Order:
      type: object
      required: [id, customer_id, status, total_bdt, payment_method, created_at]
      properties:
        id:
          type: integer
        customer_id:
          type: integer
        customer_name:
          type: string
        customer_phone:
          type: string
        status:
          type: string
          enum: [pending, confirmed, delivered, cancelled]
        total_bdt:
          type: number
        payment_method:
          type: string
          enum: [bkash, nagad, bank_transfer]
        payment_ref:
          type: string
        notes:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        created_at:
          type: string
        updated_at:
          type: string

    OrderItem:
      type: object
      required: [id, order_id, product_id, quantity, unit_price_bdt]
      properties:
        id:
          type: integer
        order_id:
          type: integer
        product_id:
          type: integer
        product_name:
          type: string
        quantity:
          type: integer
        unit_price_bdt:
          type: number

    CreateOrderBody:
      type: object
      required: [customer_id, payment_method, items]
      properties:
        customer_id:
          type: integer
        payment_method:
          type: string
          enum: [bkash, nagad, bank_transfer]
        payment_ref:
          type: string
        notes:
          type: string
        items:
          type: array
          items:
            type: object
            required: [product_id, quantity]
            properties:
              product_id:
                type: integer
                minimum: 1
              quantity:
                type: integer
                minimum: 1
                maximum: 100

    UpdateOrderStatusBody:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, confirmed, delivered, cancelled]

    # ── Customer ─────────────────────────────────────────────────────────────
    Customer:
      type: object
      required: [id, name, phone, created_at]
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        university:
          type: string
        order_count:
          type: integer
        total_spent_bdt:
          type: number
        created_at:
          type: string

    CreateCustomerBody:
      type: object
      required: [name, phone]
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        university:
          type: string

    # ── Stats ─────────────────────────────────────────────────────────────────
    AdminLoginBody:
      type: object
      required: [password]
      properties:
        password:
          type: string

    AdminLoginResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string

    # ── Reviews ──────────────────────────────────────────────────────────────
    Review:
      type: object
      required: [id, product_id, customer_name, rating, body, verified, created_at]
      properties:
        id:
          type: integer
        product_id:
          type: integer
        customer_name:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        title:
          type: string
        body:
          type: string
        verified:
          type: boolean
        created_at:
          type: string

    CreateReviewBody:
      type: object
      required: [product_id, customer_name, rating, body]
      properties:
        product_id:
          type: integer
        order_id:
          type: integer
        customer_phone:
          type: string
        customer_name:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        title:
          type: string
        body:
          type: string

    CreateReviewResponse:
      type: object
      required: [id, status]
      properties:
        id:
          type: integer
        status:
          type: string

    DashboardStats:
      type: object
      required: [total_revenue_bdt, total_orders, total_customers, total_products, pending_orders, monthly_revenue_bdt, delivered_orders, cancelled_orders]
      properties:
        total_revenue_bdt:
          type: number
        total_orders:
          type: integer
        total_customers:
          type: integer
        total_products:
          type: integer
        pending_orders:
          type: integer
        delivered_orders:
          type: integer
        cancelled_orders:
          type: integer
        monthly_revenue_bdt:
          type: number
